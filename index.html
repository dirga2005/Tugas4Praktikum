<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Parts Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">PC PARTS STORE</div>
    <ul class="menu">
      <li><a href="#home">Home</a></li>
      <li><a href="#products">Products</a></li>
      <li><a href="#about">About</a></li>
    </ul>
  </nav>

  <main>
    <section id="home" class="hero">
      <h2>Upgrade PC, Maksimalkan <span class="highlight">Performa.</span></h2>
    </section>

    <section id="products">
      <h2 class="section-title">Products</h2>
      <div class="product-grid">
        <div class="card">
          <img src="img/ssd1.jpg" alt="SSD">
          <p>SSD</p>
        </div>
        <div class="card">
          <img src="img/ram1.avif" alt="RAM">
          <p>RAM</p>
        </div>
        <div class="card">
          <img src="img/processor1.jpg" alt="Prosesor">
          <p>Prosesor</p>
        </div>
        <div class="card">
          <img src="img/kartugrafis.png" alt="Kartu Grafis">
          <p>Kartu Grafis</p>
        </div>
      </div>
    </section>

    <section id="about">
      <h2 class="section-title">About</h2>
      <p>Pilihan komponen untuk kebutuhan upgrade PC kamu.</p>
    </section>
  </main>

</body>
</html>
