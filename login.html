<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PC Parts Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <form class="login-box" action="index.html">
    <h1>PC Parts Store</h1>
    <p class="subtitle">Masuk untuk melihat komponen PC.</p>

    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="Nama pengguna">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Kata sandi">

    <button type="submit">Masuk</button>
  </form>

</body>
</html>
